      - type: weather-forecast
        entity: weather.buienradar
        show_forecast: true
        forecast_type: daily
        view_layout:
          position: sidebar

      - type: todo-list
        entity: todo.shopping_list
        title: Shopping List
        view_layout:
          position: sidebar
  
  - path: lights
    title: House Lights
    icon: mdi:lightbulb-on-outline
    badges:
      - type: entity
        entity: script.sleep_mode
        name: "Sleep Mode"
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target: 
            entity_id: script.sleep_mode
    cards:
      - type: grid
        title: "Ground Floor"
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.front_door_light
            name: "Front Door"
            icon: mdi:ceiling-light
          - type: tile
            entity: light.entryway_ceiling_light
            name: "Entryway"
            icon: mdi:ceiling-light
          - type: tile
            entity: light.toilet_ceiling_light
            name: "Toilet"
            icon: mdi:ceiling-light
          - type: tile
            entity: light.kitchen_table_lights
            name: "Kitchen Ceiling"
            icon: mdi:ceiling-light
          - type: tile
            entity: light.kitchen_bench_lights
            name: "Kitchen Bench"
            icon: mdi:ceiling-light
          - type: tile
            entity: light.living_room_ceiling_lights
            name: "Living Room Ceiling"
            icon: mdi:ceiling-light
          - type: tile
            entity: light.living_room_tv_stand_lamp
            name: "TV Stand Lamp"
            icon: mdi:lamp
          - type: tile
            entity: light.living_room_tv_stand_light
            name: "TV Stand"
            icon: mdi:led-strip
          - type: tile
            entity: light.living_room_fado_lamp
            name: "Fado Lamp"
            icon: mdi:lamp
            features:
              - type: "light-brightness"
          - type: tile
            entity: light.living_room_corner_lamp
            name: "Corner Lamp"
            icon: mdi:floor-lamp
