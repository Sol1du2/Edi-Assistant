title: EDI-Habitat
resources:
  - url: /local/button-card.js
    type: module
  - url: /local/local-conditional-card.js
    type: module

views:
  - path: default_view
    type: sidebar
    title: "Home"
    icon: mdi:home
    cards:
      - type: glance
        title: Human Presence
        entities:
          - person.joao
          - person.jelena
          - person.guest1
          - person.guest2

      # Floor Plan Control Buttons
      - type: horizontal-stack
        cards:
          # Ground Floor (inside)
          - type: custom:local-conditional-card
            id: ground_button_active
            default: show      
            persist_state: true
            card:
              type: custom:button-card
              name: Ground floor
              icon: mdi:home-floor-g
              size: 30%
              color: var(--state-active-color)
              show_name: false
              tap_action:
                action: fire-dom-event
                local_conditional_card:
                  action: set
                  ids:
                    - ground_button_active: show
                    - ground_button_inactive: hide
                    - first_button_active: hide
                    - first_button_inactive: show
                    - attic_button_active: hide
                    - attic_button_inactive: show
                    - garden_button_active: hide
                    - garden_button_inactive: show
                    - ground: show
                    - first: hide
                    - attic: hide
                    - garden: hide
          - type: custom:local-conditional-card
            id: ground_button_inactive
            default: hide      
            persist_state: true
            card:
              type: custom:button-card
              name: Ground floor
              icon: mdi:home-floor-g
              size: 30%
              color: var(--state-icon-color)
              show_name: false
              tap_action:
                action: fire-dom-event
                local_conditional_card:
                  action: set
                  ids:
                    - ground_button_active: show
                    - ground_button_inactive: hide
                    - first_button_active: hide
                    - first_button_inactive: show
                    - attic_button_active: hide
                    - attic_button_inactive: show
                    - garden_button_active: hide
                    - garden_button_inactive: show
                    - ground: show
                    - first: hide
                    - attic: hide
                    - garden: hide
          # First Floor
          - type: custom:local-conditional-card
            id: first_button_active
            default: hide
            persist_state: true
            card:
              type: custom:button-card
              name: First floor
