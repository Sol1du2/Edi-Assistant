                  ids:
                    - ground_button_active: hide
                    - ground_button_inactive: show
                    - first_button_active: show
                    - first_button_inactive: hide
                    - attic_button_active: hide
                    - attic_button_inactive: show
                    - garden_button_active: hide
                    - garden_button_inactive: show
