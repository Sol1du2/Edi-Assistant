  - path: hvac
    title: HVAC
    icon: mdi:home-thermometer-outline
    badges:
      - type: entity
        entity: sensor.ecodan_heatpump_operation_mode
        name: "Operation Mode"
        show_name: true
      - type: entity
        entity: binary_sensor.ecodan_heatpump_compressor
        name: "Compressor"
        show_name: true
      - type: entity
        entity: binary_sensor.ecodan_heatpump_booster_heater
        name: "Booster"
        show_name: true
      - type: entity
        entity: binary_sensor.ecodan_heatpump_defrost
        name: "Defrost"
        show_name: true
      - type: entity
        entity: sensor.ecodan_heatpump_estimated_cop
        name: "Est. COP"
        show_name: true
      - type: entity 
        entity: sensor.ecodan_heatpump_compressor_frequency
        name: "Compressor Freq."
        show_name: true
      - type: entity 
        entity: sensor.ecodan_heatpump_output_power
        name: "Output Power"
        show_name: true
      - type: entity 
        entity: sensor.ecodan_heatpump_pump_consumption
        name: "Pump Power"
        show_name: true
      - type: entity
        entity: sensor.ecodan_heatpump_outside_temp
        name: "Outside Temperature"
        show_name: true
      - type: entity
        entity: sensor.ecodan_heatpump_feed_temp
        name: "Feed Temperature"
        show_name: true
      - type: entity
        entity: sensor.ecodan_heatpump_return_temp
        name: "Returning Temperature"
        show_name: true
      - type: entity
        entity: sensor.ecodan_heatpump_dhw_current_temp
        name: "DHW T1"
        show_name: true
      - type: entity
        entity: sensor.ecodan_heatpump_dhw_secondary_temp
        name: "DHW T2"
        show_name: true
    cards:
      - type: vertical-stack
        title: "Controllers"
        cards:
          - type: thermostat
            entity: climate.ecodan_heatpump_zone_1_room_temp
            name: "Space Temperature"
            show_current_as_primary: true
          - type: thermostat
            entity: climate.ecodan_heatpump_dhw_climate
            name: "DHW"
            show_current_as_primary: true
      - type: vertical-stack
        title: "Heat Pump Sensors"
        cards:
          # General status
          - type: history-graph
            title: "Overview"
            entities:
              - entity: sensor.ecodan_heatpump_operation_mode
                name: "Operating Mode"
              - entity: binary_sensor.ecodan_heatpump_compressor
                name: "Compressor"
              - entity: binary_sensor.ecodan_heatpump_booster_heater
                name: "Booster Heater"
              - entity: binary_sensor.ecodan_heatpump_defrost
                name: "Defrost"
          - type: history-graph
            title: "Operating Temperatures"
            entities:
              - entity: sensor.ecodan_heatpump_outside_temp
                name: "Outside Temperature"
