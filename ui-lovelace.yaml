  - path: printer
    title: 3D Printer
    icon: mdi:printer-3d
    cards:
      - type: vertical-stack
        title: Droopy Power
        cards:
          - type: entity
            name: Status
            entity: sensor.droopy_power_status
          - type: grid
            columns: 2
            cards:
              - type: button
                name: "On/Off"
                icon: mdi:power-cycle
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target: 
                    entity_id: script.power_cycle_droopy
              - type: button
                name: "Emergency Off"
                icon: mdi:flash-alert-outline
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.emergency_power_off_droopy
          - type: picture-entity
            entity: camera.droopy_camera
      - type: vertical-stack
        title: Droopy Status
        cards:
          - type: sensor
            entity: sensor.droopy_cpu_temperature
            name: "Droopy CPU Temperature"
            graph: line
          - type: entities
            entities:
              - sensor.octoprint_current_state
              - sensor.octoprint_actual_tool0_temp
              - sensor.octoprint_actual_bed_temp
              - sensor.octoprint_target_tool0_temp
              - sensor.octoprint_target_bed_temp
              - sensor.octoprint_job_percentage
