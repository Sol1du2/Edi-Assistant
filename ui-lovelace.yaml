        hours_to_show: 24
 
  - path: monitoring
    title: "Monitoring"
    icon: mdi:monitor-eye
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # System Status
          - type: markdown
            content: |
              ## Home-Assistant
              {% if is_state('binary_sensor.home_assistant_website_update_available', 'on') %}
                Version {{ states('sensor.home_assistant_website') }} is available. [Release Notes]({{ state_attr('sensor.home_assistant_website', 'release_notes') }})
              {% else %}
                Up-to-date <ha-icon icon="mdi:robot-happy-outline"></ha-icon>
              {% endif %}

              ## Pi-Hole-Main
              {% if is_state('update.pi_hole_core_update_available', 'on') %}
                __Core__ Version {{ state_attr('update.pi_hole_core_update_available', 'latest_version') }} is available. [Release Notes]({{ state_attr('update.pi_hole_core_update_available', 'release_url') }})
              {% else %}
                __Core__ Up-to-date <ha-icon icon="mdi:robot-happy-outline"></ha-icon>
              {% endif %}
              {% if is_state('update.pi_hole_ftl_update_available', 'on') %}
                __FTL__ Version {{ state_attr('update.pi_hole_ftl_update_available', 'latest_version') }} is available. [Release Notes]({{ state_attr('update.pi_hole_ftl_update_available', 'release_url') }})
              {% else %}
                __FTL__ Up-to-date <ha-icon icon="mdi:robot-happy-outline"></ha-icon>
              {% endif %}
              {% if is_state('update.pi_hole_web_update_available', 'on') %}
                __Web UI__ Version {{ state_attr('update.pi_hole_web_update_available', 'latest_version') }} is available. [Release Notes]({{ state_attr('update.pi_hole_web_update_available', 'release_url') }})
              {% else %}
                __Web UI__ Up-to-date <ha-icon icon="mdi:robot-happy-outline"></ha-icon>
              {% endif %}

          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.system_monitor_processor_use
              - type: gauge
                entity: sensor.system_monitor_memory_usage
          - type: sensor
            entity: sensor.system_monitor_processor_temperature
            name: "CPU Temperature"
            graph: line
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # Device Control
          - type: vertical-stack
            title: "Presence"
            cards:
              - type: button
                name: "Request Presence"
                icon: mdi:home-account
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  target:
                    topic: bouncer/request/presence
              - type: grid
                columns: 4
                cards:    
                  - type: button
                    name: João
                    entity: input_boolean.enable_joao
                  - type: button
                    name: Jelena
                    entity: input_boolean.enable_jelena
                  - type: button
                    name: Guest1
                    entity: input_boolean.enable_guest1
                  - type: button
                    name: Guest2
                    entity: input_boolean.enable_guest2
          - type: grid
            title: "Leviathan"
            columns: 3
            cards:
              - type: button
                name: On/Off
                icon: mdi:desktop-tower-monitor
                entity: switch.leviathan_toggle
          - type: grid
            title: "Battery Chargers"
            columns: 3
            cards:
              - type: button
                name: "Hota D6 Pro 1"
                entity: switch.hota_d6_pro_1
                icon: mdi:battery-heart-outline
              - type: button
                name: "Hota D6 Pro 2"
                entity: switch.hota_d6_pro_2
                icon: mdi:battery-heart-outline
              - type: button
                name: "Hota D6 Pro 3"
                entity: switch.hota_d6_pro_3
                icon: mdi:battery-heart-outline
          - type: grid
            title: "Pi Hole"
            columns: 3
            cards:
              - type: button
                entity: switch.pi_hole
                name: "Disable Pi-Hole (1 minute)"
                icon: mdi:pi-hole
                show_state: true
                tap_action:
                  action: perform-action
                  perform_action: pi_hole.disable
                  target:
                    entity_id: switch.pi_hole
                  data:
                    duration: "00:01"
          - type: grid
            title: "Misc"
            columns: 3
            cards:    
              - type: button
                name: Halloween
                entity: input_boolean.halloween_mode
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # Sensor Status
          - type: entities
            title: "Switch Batteries"
            entities:
              - sensor.cuby_battery
              - sensor.kitchen_switch_battery
              - sensor.office_jelena_switch_battery
              - sensor.bedroom_switch_1_battery
              - sensor.bedroom_switch_2_battery
              - sensor.attic_desk_lamps_switch_battery
              - sensor.attic_desk_ceiling_lights_switch_battery
              - sensor.mechanical_room_ceiling_lights_switch_1_battery
              - sensor.mechanical_room_ceiling_lights_switch_2_battery
          - type: entities
            title: "Climate Sensor Batteries"
            entities:
              - sensor.ground_floor_ambient_sensor_battery
              - sensor.shed_ambient_sensor_battery
              - sensor.bedroom_ambient_sensor_battery
              - sensor.bathroom_ambient_sensor_battery
              - sensor.attic_ambient_sensor_battery
              - sensor.filament_ambient_sensor_battery
          - type: entities
            title: "Motion Sensor Batteries"
            entities:
              - sensor.entryway_motion_sensor_battery
              - sensor.hallway_motion_sensor_battery
          - type: entities
            title: "Door Sensor Batteries"
            entities:
              - sensor.mechanical_room_door_sensor_battery
