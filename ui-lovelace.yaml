      # Ground Floor (inside)
      - type: custom:local-conditional-card
        id: ground
        default: show      
        persist_state: true
        card:
          type: picture-elements
          image: /local/plan-ground-floor.svg
          elements:
            # Entryway
            - type: state-icon
              icon: mdi:ceiling-light
              tap_action:
                action: toggle
              double_tap_action:
                action: more-info
              entity: switch.entryway_ceiling_light
              style:
                top: 32%
                left: 82%
            - type: state-icon
              icon: mdi:outdoor-lamp
              tap_action:
                action: toggle
              double_tap_action:
                action: more-info
              entity: switch.front_door_light
              style:
                top: 43%
                left: 99%
            # Toilet
            - type: state-icon
