- id: heatpump_split_daily_energy_by_operation_mode
  alias: "Heatpump split daily energy by operation mode"
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.ecodan_heatpump_operation_mode
    - trigger: homeassistant
      event: start
  variables:
    op: "{{ states('sensor.ecodan_heatpump_operation_mode') }}"
    tariff: >
      {% if op in ['Heating Water', 'Legionella Prevention'] %}
        dhw
      {% elif op == 'Space Heating' %}
        heating
      {% elif op == 'Space Cooling' %}
        cooling
      {% elif op == 'Frost Protection' %}
        frost
      {% elif op in ['Idle', 'Standby', 'Off'] %}
        idle
      {% elif op in ['unknown', 'unavailable', '', None] %}
        other
      {% else %}
        other
      {% endif %}
  actions:
    - action: select.select_option
      target:
        entity_id: select.ecodan_energy_by_mode_daily
      data:
        option: "{{ tariff }}"

- id: sync_temperature_to_adaptive_controller
  alias: Sync Room Temp to Auto-Adaptive Controller
  description: "Ensures the heat pump's feedback value matches the living room current temp"
  triggers:
    - trigger: template
      value_template: >-
        "{{ state_attr('climate.ecodan_heatpump_zone_1_room_temp', 'current_temperature') | float(0) !=
          states('number.ecodan_heatpump_auto_adaptive_current_room_temperature_feedback_z1') | float(0) }}"
  actions:
    - action: number.set_value
      target:
        entity_id: number.ecodan_heatpump_auto_adaptive_current_room_temperature_feedback_z1
      data:
        value: "{{ state_attr('climate.ecodan_heatpump_zone_1_room_temp', 'current_temperature') | float(0) }}"
