- id: notify_high_humidity_bathroom
  alias: Humidity is too high in the bathroom
  triggers:
    - trigger: numeric_state
      entity_id: sensor.bathroom_ambient_sensor_humidity
      above: 85
  variables:
    ground_floor_humidity: "{{ states('sensor.ground_floor_ambient_sensor_humidity') | float(0) }}"
    bedroom_humidity: "{{ states('sensor.bedroom_ambient_sensor_humidity') | float(0) }}"
    attic_humidity: "{{ states('sensor.attic_ambient_sensor_humidity') | float(0) }}"
    bathroom_humidity: "{{ states('sensor.bathroom_ambient_sensor_humidity') | float(0) }}"
    average_humidity: "{{ (ground_floor_humidity + bedroom_humidity + attic_humidity) / 3 }}"
  conditions:
    - condition: template
      value_template: "{{ bathroom_humidity > (average_humidity + 10) }}"
  actions:
    - action: notify.send_message
      data:
        entity_id: 
          - notify.telegram_joao
          - notify.telegram_jelena
        message: |
          The humidity in the bathroom is 10% higher than the average in the house. Did you turn on the ventilation?
          Bathroom humidity: {{ states('sensor.bathroom_ambient_sensor_humidity') }}%
          House average: {{ average_humidity | round(1) }}%