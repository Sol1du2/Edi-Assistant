- id: notify_very_high_humidity
  alias: Humidity is very high in a certain room
  triggers:
    - trigger: numeric_state
      entity_id: 
        - sensor.ground_floor_ambient_sensor_humidity
        - sensor.bedroom_ambient_sensor_humidity
        - sensor.attic_ambient_sensor_humidity
      above: 70
  actions:
    - variables:
        room_name: >-
          {% set rooms = {
            "sensor.ground_floor_ambient_sensor_humidity": "ground floor",
            "sensor.bedroom_ambient_sensor_humidity": "bedroom",
            "sensor.attic_ambient_sensor_humidity": "attic"
          } %}
          {{ rooms.get(trigger.entity_id, trigger.entity_id) }}
    - action: notify.send_message
      data:
        entity_id: 
          - notify.telegram_joao
          - notify.telegram_jelena
        message: "Warning, the humidity in the {{ room_name }} is above 70."

