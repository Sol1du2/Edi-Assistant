- id: heating_status_telegram
  alias: Heating Status via Telegram
  triggers:
    trigger: event
    event_type: telegram_command
    event_data:
      command: '/heating'
  actions:
    - action: telegram_bot.send_message
      data:
        chat_id: "{{ trigger.event.data.chat_id }}"
        message: |
          *State:* {{ states('climate.warmy') }}
          *Current Temperature:* {{ state_attr('climate.warmy', 'current_temperature') }}°C
          *Set Temperature:* {{ state_attr('climate.warmy', 'temperature') }}°C
          *Current Action:* {{ state_attr('climate.warmy', 'hvac_action') }}
          *Preset Mode:* {{ state_attr('climate.warmy', 'preset_mode') }}

- id: hvac_status_telegram
  alias: HVAC Status via Telegram
  triggers:
    trigger: event
    event_type: telegram_command
    event_data:
      command: '/hvac'
  actions:
    - action: telegram_bot.send_message
      data:
        chat_id: "{{ trigger.event.data.chat_id }}"
        message: |
          *Ground Floor:*
            Temperature: {{ states('sensor.ground_floor_ambient_sensor_temperature') }}°C
            Humidity: {{ states('sensor.ground_floor_ambient_sensor_humidity') }}%
          *Shed:*
            Temperature: {{ states('sensor.shed_ambient_sensor_temperature') }}°C
            Humidity: {{ states('sensor.shed_ambient_sensor_humidity') }}%
          *Bedroom:*
            Temperature: {{ states('sensor.bedroom_ambient_sensor_temperature') }}°C
            Humidity: {{ states('sensor.bedroom_ambient_sensor_humidity') }}%
          *Bathroom:*
            Temperature: {{ states('sensor.bathroom_ambient_sensor_temperature') }}°C
            Humidity: {{ states('sensor.bathroom_ambient_sensor_humidity') }}%
          *Attic:*
            Temperature: {{ states('sensor.attic_ambient_sensor_temperature') }}°C
            Humidity: {{ states('sensor.attic_ambient_sensor_humidity') }}%
          *Filament Box:*
            Temperature: {{ states('sensor.filament_ambient_sensor_temperature') }}°C
            Humidity: {{ states('sensor.filament_ambient_sensor_humidity') }}%

- id: heating_on_telegram
  alias: Turn on Heating via Telegram
  triggers:
    trigger: event
    event_type: telegram_command
    event_data:
      command: '/heating_on'
  actions:
    - action: climate.turn_on
      entity_id: climate.warmy
    - action: telegram_bot.send_message
      data:
        chat_id: "{{ trigger.event.data.chat_id }}"
        message: Heating has been turned on!

- id: heating_off_telegram
  alias: Turn off Heating via Telegram
  triggers:
    trigger: event
    event_type: telegram_command
    event_data:
      command: '/heating_off'
  actions:
    - action: climate.turn_off
      entity_id: climate.warmy
    - action: telegram_bot.send_message
      data:
        chat_id: "{{ trigger.event.data.chat_id }}"
        message: Heating has been turned off!