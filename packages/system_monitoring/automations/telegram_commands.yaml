- id: leviathan_on_telegram
  alias: Turn on Leviathan via Telegram
  triggers:
    trigger: event
    event_type: telegram_command
    event_data:
      command: '/leviathan_on'
  actions:
    - action: wake_on_lan.send_magic_packet
      data:
        mac: !secret leviathan_mac_address
    - action: telegram_bot.send_message
      data:
        chat_id: "{{ trigger.event.data.chat_id }}"
        message: Leviathan booting up

- id: leviathan_off_telegram
  alias: Turn off Leviathan via Telegram
  triggers:
    - trigger: event
      event_type: telegram_command
      event_data:
        command: '/leviathan_off'
    - trigger: event
      event_type: telegram_callback
      event_data:
        command: '/leviathan_off'
  actions:
    - action: shell_command.shutdown_leviathan
    - action: telegram_bot.send_message
      data:
        chat_id: "{{ trigger.event.data.chat_id }}"
        message: Leviathan shutting down
    - condition:
      - condition: template
        value_template: "{{ trigger.event.event_type == 'telegram_callback' }}"
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: "{{ trigger.event.data.id }}"
        message: Alright, shutting down Leviathan 😄
        show_alert: false
