- id: edi_rebooted
  alias: Edi Rebooted
  triggers:
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: "{{ (as_timestamp(now()) - as_timestamp(states('sensor.last_boot'))) | int < 120 }}"
  actions:
    - action: notify.send_message
      data:
        entity_id: notify.telegram_joao
        message: "Edi has just rebooted ({{ (as_timestamp(now()) - as_timestamp(states('sensor.last_boot'))) | int }} seconds ago)"

- id: power_cut
  alias: Power Cut
  triggers:
    - trigger: state
      entity_id: sensor.ups_status
      to: "ONBATT"
  actions:
    - action: notify.send_message
      data:
        entity_id: notify.telegram_joao
        message: "Power failure on Edi's UPS. Running on batteries!"

- id: shutdown_low_battery
  alias: Shutdown system when running on low battery
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ups_battery
      below: 10
  conditions:
    - condition: state
      entity_id: sensor.ups_status
      state: "ONBATT"
  actions:
    - action: notify.send_message
      data:
        entity_id: 
          - notify.telegram_joao
          - notify.telegram_jelena
        message: "UPS Battery too low. Shutting down systems... Bye!"
    - delay:
        seconds: 10
    - action: shell_command.shutdown_pihole
    - action: shell_command.shutdown_edi
      