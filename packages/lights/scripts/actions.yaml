sleep_mode:
  alias: Sleep Mode
  sequence:
    - action: script.all_lights_off

tv_mode:
  alias: TV Mode
  sequence:
    - action: light.turn_off
      target:
        area_id: kitchen
    - action: light.turn_off
      target:
        entity_id:
          - light.living_room_ceiling_lights
          - light.living_room_tv_stand_lamp
    - action: light.turn_on
      target:
        entity_id: 
          - light.living_room_fado_lamp
          - light.living_room_corner_lamp

all_lights_off:
  alias: All Lights Off
  sequence:
    - action: light.turn_off
      target:
        floor_id:
          - ground_floor
          - first_floor
          - attic

all_lights_on:
  alias: All Lights On
  sequence:
    - action: light.turn_on
      target:
        floor_id:
          - ground_floor
          - first_floor
          - attic

halloween_loop:
