# Living Room
- id: living_room_turn_on_lamps_with_main_switch
  alias: Turn on living room lamps with main switch
  triggers:
    - trigger: state
      entity_id: switch.living_room_ceiling_lights
      to: "on"
    - trigger: state
      entity_id: switch.living_room_ceiling_lights
      to: "off"
  actions:
    - choose:
      # 1) Physical press + lamp turned ON → turn ON lamps as well
      - conditions:
        - condition: state
          entity_id: input_boolean.ha_toggle_in_progress
          state: 'off'
        - condition: template
          value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id:
                - light.living_room_fado_lamp
                - light.living_room_corner_lamp
      # 2) Physical press + lamp turned OFF → turn OFF lamps as well
      - conditions:
        - condition: state
          entity_id: input_boolean.ha_toggle_in_progress
          state: 'off'
        - condition: template
          value_template: "{{ trigger.to_state.state == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id:
                - light.living_room_fado_lamp
                - light.living_room_corner_lamp

- id: set_ha_toggle_when_living_room_ceiling_lights_controller_by_ha
  alias: Set HA-toggle flag when lamp is controlled by HA
  mode: single
  triggers:
    # direct switch services
    - trigger: event
      event_type: call_service
      event_data:
        domain: switch
        service: turn_on
    - trigger: event
      event_type: call_service
      event_data:
        domain: switch
        service: turn_off
    - trigger: event
      event_type: call_service
      event_data:
        domain: switch
        service: toggle

  # only if *this* switch is in the service_data.entity_id
  conditions:
    - condition: template
      value_template: >
        {# pull out the service_data dict #}
        {% set sd = trigger.event.data.service_data %}
        {# case 1: explicit entity_id in service_data #}
        {% if sd.entity_id is defined %}
          {# entity_id could be a string or a list #}
          {{ 'switch.living_room_ceiling_lights' in sd.entity_id }}
        {% elif sd.area_id is defined %}
          {# catch area toggles: list of area IDs #}
          {{ 'living_room' in sd.area_id }}
        {% elif sd.floor_id is defined %}
          {# catch floor toggles: list of floor IDs #}
          {{ 'ground_floor' in sd.floor_id }}
        {% else %}
          false
        {% endif %}
  actions:
    - action: input_boolean.turn_on
      entity_id: input_boolean.ha_toggle_in_progress

    # keep the flag up just long enough for the state-change automation to see it
    - delay: '00:00:01'

    - action: input_boolean.turn_off
      entity_id: input_boolean.ha_toggle_in_progress

