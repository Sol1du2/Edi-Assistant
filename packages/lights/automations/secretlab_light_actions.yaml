- id: secretlab_light_auto_turn_on_off
  alias: Secretlab lights follow Leviathan
  triggers:
    - trigger: state
      entity_id: switch.leviathan_toggle
      to: "on"
    - trigger: state
      entity_id: switch.leviathan_toggle
      to: "off"
      for: "00:02:00"   # Avoid flapping during reboot / brief network hiccups
  actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: switch.leviathan_toggle
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.secretlab_magrgb_lightstrip
      - conditions:
          - condition: state
            entity_id: switch.leviathan_toggle
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.secretlab_magrgb_lightstrip