- id: turn_on_entryway_light_movement
  alias: Turn on Light in the entryway when movement is detected
  triggers:
    - trigger: state
      entity_id: binary_sensor.entryway_motion_sensor_occupancy
      to: "on"
  conditions:
    - condition: numeric_state
      entity_id: sensor.entryway_motion_sensor_illuminance
      below: 15
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.entryway_ceiling_light

- id: turn_off_entryway_light_movement
  alias: Turn off Light in the entryway when movement no longer detected
  triggers:
    - trigger: state
      entity_id: binary_sensor.entryway_motion_sensor_occupancy
      to: "off"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.entryway_ceiling_light

- id: turn_on_hallway_light_movement
  alias: Turn on Light in the hallway when movement is detected
  triggers:
    - trigger: state
      entity_id: binary_sensor.hallway_motion_sensor_occupancy
      to: "on"
  conditions:
    - condition: numeric_state
      entity_id: sensor.hallway_motion_sensor_illuminance
      below: 15
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.hallway_ceiling_light

- id: turn_off_hallway_light_movement
  alias: Turn off Light in the hallway when movement no longer detected
  triggers:
    - trigger: state
      entity_id: binary_sensor.hallway_motion_sensor_occupancy
      to: "off"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.hallway_ceiling_light
