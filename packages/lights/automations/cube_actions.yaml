# Shake Cube
- id: cuby_set_tv_mode
  alias: Set tv mode in the living room
  triggers:
    - trigger: device
      domain: mqtt
      device_id: f4bd7e14a3dd31d84fd38056894d307b
      type: action
      subtype: shake
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.tv_mode

# Double tap Cube
- id: cuby_toggle_kitchen_lights
  alias: Toggle kitchen lights on double tap cuby
  triggers:
    - trigger: device
      domain: mqtt
      device_id: f4bd7e14a3dd31d84fd38056894d307b
      type: action
      subtype: tap
  actions:
    - action: switch.toggle
      target:
        area_id: kitchen

# Rotate Cube 90 degrees
- id: cuby_set_lamps_only_living_room
  alias: Set lamps only on living room
  triggers:
    - trigger: device
      domain: mqtt
      device_id: f4bd7e14a3dd31d84fd38056894d307b
      type: action
      subtype: flip90
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.living_room_ceiling_lights
    - action: light.turn_on
      target:
        entity_id: light.living_room_fado_lamp
    - action: light.turn_on
      target:
        entity_id: light.living_room_corner_lamp

# Throw Cube in the air
- id: cuby_toggle_ceiling_lights_living_room
  alias: Toggle the ceiling lights in the living room
  triggers:
    - trigger: device
      domain: mqtt
      device_id: f4bd7e14a3dd31d84fd38056894d307b
      type: action
      subtype: fall
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.living_room_ceiling_lights
