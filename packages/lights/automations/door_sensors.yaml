- id: mechanical_room_lights_on_door_open
  alias: Turn on mechanical room lights when closet door opens
  triggers:
    - trigger: state
      entity_id: binary_sensor.mechanical_room_door_sensor_contact
      from: "off"
      to: "on"
  actions:
    - action: light.turn_on
      entity_id: light.mechanical_room_ceiling_lights

- id: mechanical_room_lights_of_door_open
  alias: Turn off mechanical room lights when closet door closes
  triggers:
    - trigger: state
      entity_id: binary_sensor.mechanical_room_door_sensor_contact
      from: "on"
      to: "off"
  actions:
    - action: light.turn_off
      entity_id: light.mechanical_room_ceiling_lights

